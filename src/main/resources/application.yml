server:
  port: 8083

spring:
  application:
    name: voting-service
  datasource:
    # VOTING_DB_URL is the server base URL shared by all services, e.g. jdbc:postgresql://localhost:5432.
    # All services share the voting_system database; each owns one schema (currentSchema).
    url: ${VOTING_DB_URL}/voting_system?currentSchema=voting_service
    username: ${VOTING_DB_USER}
    password: ${VOTING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # prod = JSON logs; add "logstash" to also ship them to ELK
  profiles:
    group:
      prod: json-logs
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Propagate trace ids through Kafka headers (vote.cast → result-service)
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Fail fast (5 s, default 60 s) when the broker is down; the vote is already committed by then.
        max.block.ms: 5000
    consumer:
      group-id: voting-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.voting.votingservice.dto.CandidateEvent
        spring.json.trusted.packages: com.voting.votingservice.dto

voting:
  redis:
    key-prefix: "vot:"
    voted-ttl: 86400
    idempotency-ttl: 86400
  chain:
    # Link each vote to the previous vote's hash in its election (serialised per election).
    enabled: ${VOTING_CHAIN_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      candidateService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        ignore-exceptions:
          - com.voting.votingservice.exception.InvalidCandidateException
  retry:
    instances:
      candidateService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$BadGateway
          - feign.FeignException$GatewayTimeout
  bulkhead:
    instances:
      candidateService:
        max-concurrent-calls: 50
        max-wait-duration: 100ms

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 0.0 locally: trace ids still appear in logs but nothing is exported; docker-compose sets 1.0
      probability: ${TRACING_SAMPLING:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  health:
    circuitbreakers:
      enabled: true

logging:
  logstash:
    destination: ${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5000}
